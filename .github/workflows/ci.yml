name: Calidad del marketplace

# Puerta de calidad: nada llega a main sin que la estructura sea valida y los hooks y scripts
# de los cuatro equipos funcionen en Windows, macOS y Linux (sin bash).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Identidad de git para las pruebas
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - name: Validar la estructura
        run: python tools/validar.py
      - name: Pruebas de hooks y scripts
        run: python -m unittest discover -s tests -v

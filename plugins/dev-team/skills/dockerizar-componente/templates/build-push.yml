# .github/workflows/build-push.yml — reusable, estándar FaaST.
# Construye y publica la imagen en GHCR. NO despliega (eso es cd-<instancia>.yml).

on:
  workflow_call:
    inputs:
      dotnet_version: { type: string, default: "8.0" }
      solution_dir:   { type: string, default: "." }
      project:        { type: string, required: false }
      dockerfile:     { type: string, default: "Dockerfile" }
      instancia:      { type: string, required: true }
    secrets:
      nuget_auth_token: { required: false }

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          echo "version=$(cat VERSION 2>/dev/null || echo 0.0.0)" >> "$GITHUB_OUTPUT"
          echo "repo=${{ github.event.repository.name }}"          >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          # REGLA DURA (architecture.md §A.12 / ADR-013): sin attestations.
          provenance: false
          build-args: |
            DOTNET_VERSION=${{ inputs.dotnet_version }}
            SOLUTION_DIR=${{ inputs.solution_dir }}
            PROJECT=${{ inputs.project }}
          secrets: |
            nuget_auth_token=${{ secrets.nuget_auth_token }}
          tags: |
            ghcr.io/faast-app/${{ steps.meta.outputs.repo }}:sha-${{ github.sha }}
            ghcr.io/faast-app/${{ steps.meta.outputs.repo }}:${{ inputs.instancia }}-v${{ steps.meta.outputs.version }}

      # El digest es lo que el corte por imagen promueve entre ambientes.
      # El tag sha-<sha> es PERMANENTE: no se borra nunca (ADR-013 addendum).
      - run: echo "digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

# Prohibido trasladar del CI legacy:
#   - "Delete existing release and tag": los tags de imagen son INMUTABLES.
#   - Publicar el .zip como artefacto de despliegue: el artefacto es la imagen.

# infra/nginx.conf — frontend FaaST (familias F1-F4)
#
# nginx corre con el UID/GID del usuario de despliegue (p. ej. ec2-user) que inyecta docker-compose.yml
# (regla dura #2): de ahi el puerto 8080 (un proceso no-root no puede bindear
# puertos < 1024) y de ahi que env.js y health.json se sirvan con `alias` desde
# /tmp — el entrypoint los genera ahi porque /usr/share/nginx/html no le
# pertenece al proceso, y no tiene por que pertenecerle.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # env.js lo genera el entrypoint en runtime, en /tmp: nunca se cachea.
    location = /env.js {
        alias /tmp/env.js;
        default_type application/javascript;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Health del front (paso 4.5): JSON con component/version/status, generado
    # por el entrypoint a partir de version.txt. Sin datos sensibles.
    location = /health {
        alias /tmp/health.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    # Fallback de SPA: cualquier ruta del router devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SOLO en el contenedor que hace de contenedora/shell del tier público:
    # el split de /api/* lo hace este nginx, NO el Apache del host (ADR-036 §5).
    # location /api/ {
    #     proxy_pass http://gateway:8080;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ~* \.(js|css|woff2?|png|jpg|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organización PO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* po-team · plantilla "organizacion": tablero de un vistazo. Fila de KPIs, cambios desde la revision anterior,
   una tarjeta por sprint con su recorrido hacia el VB y abajo las fechas comprometidas y lo que pide atencion.
   Se llena sola con el JSON del bloque id="datos" (mismo formato que tablero.html). */
:root{
  --bg:#eef2f4; --surface:#ffffff; --fg:#14202a; --muted:#5d6b76; --line:#d6dee3; --accent:#0e6e74;
  --done:#1f7a4a; --done-bg:#dcf2e5; --ok:#2d6aa3; --ok-bg:#dde9f6; --pase:#6a46b8; --pase-bg:#ebe4f9;
  --val:#a86a06; --val-bg:#fbefd4; --obs:#b3352a; --obs-bg:#fbe1de; --wait:#5d6b76; --wait-bg:#e7ecef; --dev:#3c4a55; --dev-bg:#e3e8ec;
  --f-ui:"Figtree",ui-sans-serif,system-ui,sans-serif; --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161b; --surface:#172129; --fg:#e4ebf0; --muted:#9aa9b4; --line:#2a3842; --accent:#5cc4c9;
  --done:#7fdba6; --done-bg:#163a27; --ok:#94c2ee; --ok-bg:#16304a; --pase:#c2acf5; --pase-bg:#2c2347;
  --val:#f0c46c; --val-bg:#3b2e10; --obs:#f3a196; --obs-bg:#43201c; --wait:#a8b5be; --wait-bg:#24313a; --dev:#c3cfd8; --dev-bg:#26333c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161b; --surface:#172129; --fg:#e4ebf0; --muted:#9aa9b4; --line:#2a3842; --accent:#5cc4c9;
  --done:#7fdba6; --done-bg:#163a27; --ok:#94c2ee; --ok-bg:#16304a; --pase:#c2acf5; --pase-bg:#2c2347;
  --val:#f0c46c; --val-bg:#3b2e10; --obs:#f3a196; --obs-bg:#43201c; --wait:#a8b5be; --wait-bg:#24313a; --dev:#c3cfd8; --dev-bg:#26333c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:28px 56px;display:grid;gap:22px}
@media (min-width:700px){.wrap{padding-inline:20px}}
a{color:inherit}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px}
.eyb{margin:0;font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);font-weight:700}
h1{margin:2px 0 0;font-size:2rem;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.date{color:var(--muted);font-size:.85rem;margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:2px}
.kpi b{font-family:var(--f-num);font-size:1.9rem;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi b small{font-size:.9rem;color:var(--muted)}
.kpi span{font-size:.82rem;color:var(--muted)}
.kpi.hl{background:var(--accent);border-color:var(--accent);color:var(--surface)}.kpi.hl span{color:inherit;opacity:.85}.kpi.hl b{font-size:1.25rem;font-family:var(--f-ui)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,265px),1fr));gap:14px}
.spr{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px;align-content:start;min-width:0}
.spr header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.spr h2{margin:0;font-family:var(--f-num);font-size:2.4rem;line-height:1}.spr h2.sm{font-family:var(--f-ui);font-size:1.4rem;font-weight:800;line-height:1.15}
.ring{--p:0;flex:none;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--done) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;gap:1px;font-family:var(--f-num);font-weight:700;font-size:.95rem}
.ring small{font-size:.6rem}
.stage{margin:0}.pill{display:inline-block;font-weight:700;font-size:.82rem;padding:3px 10px;border-radius:999px}
.p4{background:var(--done-bg);color:var(--done)}.p2,.p3{background:var(--pase-bg);color:var(--pase)}.p1,.p0{background:var(--val-bg);color:var(--val)}
.sub{margin:0;font-size:.84rem;color:var(--muted)}
.nota{margin:0;font-size:.8rem;color:var(--val);background:var(--val-bg);padding:4px 8px;border-radius:6px;justify-self:start}
.steps{list-style:none;margin:2px 0;padding:0;display:grid;grid-auto-columns:1fr;grid-auto-flow:column;position:relative}
.steps li{display:grid;justify-items:center;gap:4px;position:relative;text-align:center}
.steps li::before{content:"";position:absolute;top:7px;left:-50%;width:100%;height:3px;background:var(--line);z-index:0}
.steps li:first-child::before{display:none}
.steps li.on::before,.steps li.now::before{background:var(--done)}
.dot{width:16px;height:16px;border-radius:50%;background:var(--surface);border:3px solid var(--line);position:relative;z-index:1}
.on .dot{background:var(--done);border-color:var(--done)}
.now .dot{border-color:var(--pase);background:var(--pase-bg);box-shadow:0 0 0 4px var(--pase-bg)}
.sl{font-size:.64rem;line-height:1.2;color:var(--muted)}.now .sl{color:var(--pase);font-weight:700}
.pts{display:flex;justify-content:space-between;gap:8px;font-size:.82rem;color:var(--muted)}.pts b{color:var(--fg);font-family:var(--f-num)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--done);border-radius:99px}
.tks{display:flex;flex-wrap:wrap;gap:6px}
.tk{display:inline-flex;align-items:center;gap:6px;padding:3px 4px 3px 8px;border-radius:7px;font-size:.78rem;text-decoration:none;border:1px solid transparent}
.tk:hover,.tk:focus-visible{border-color:currentColor;outline:none}
.tk b{font-family:var(--f-num);font-weight:700}.pt{font-family:var(--f-num);font-size:.7rem;background:var(--surface);border-radius:5px;padding:0 5px;min-width:18px;text-align:center}
.tk .gh{font-size:.66rem;font-weight:600;white-space:nowrap;padding:0 6px 0 7px;border-left:1px solid currentColor;margin-left:1px;line-height:1.5}
.tk.nv{outline:2px solid var(--accent);outline-offset:1px}
.tk.nv b::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:4px;vertical-align:2px}
.cierre{margin:0;font-size:.82rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}.cierre b{color:var(--fg);font-family:var(--f-num)}
.c-done{background:var(--done-bg);color:var(--done)}.c-ok{background:var(--ok-bg);color:var(--ok)}.c-pase{background:var(--pase-bg);color:var(--pase)}
.c-val{background:var(--val-bg);color:var(--val)}.c-obs{background:var(--obs-bg);color:var(--obs)}.c-wait{background:var(--wait-bg);color:var(--wait)}.c-dev{background:var(--dev-bg);color:var(--dev)}
.legend{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.78rem;color:var(--muted)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap}
.sync{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:grid;gap:8px}
.sync-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.sync-h strong{font-size:.95rem;font-weight:800}
.sync-h span{font-size:.82rem;color:var(--muted)}.sync-h span b{color:var(--fg);font-family:var(--f-num);font-weight:700}
.dotlive{width:8px;height:8px;border-radius:50%;background:var(--done);display:inline-block;align-self:center}
.chg{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.chg li{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:2px 8px}
.chg a{font-family:var(--f-num);font-weight:700;color:var(--accent);text-decoration:none}
.chg i{font-style:normal;color:var(--muted)}
.sync-msg{margin:0;font-size:.84rem;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px;align-items:start}
.sec{display:grid;gap:10px;min-width:0}.sec h2{margin:0;font-size:1.15rem;font-weight:800}
.hitos{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.h{display:grid;grid-template-columns:88px 1fr;gap:12px;align-items:center;padding:10px 14px;border-radius:12px;border-left:5px solid currentColor}
.hd{display:grid;line-height:1.15}.hd b{font-family:var(--f-num);font-size:1.15rem}.hd small{font-size:.72rem;opacity:.8}
.ht{display:grid;line-height:1.3;color:var(--fg)}.ht b{font-size:.95rem}.ht small{color:var(--muted);font-size:.8rem}
.risk{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.risk ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:.88rem}
.risk .lv{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;border-radius:5px;margin-right:6px}
.lv-alto{background:var(--obs-bg);color:var(--obs)}.lv-medio{background:var(--val-bg);color:var(--val)}.lv-bajo{background:var(--wait-bg);color:var(--wait)}
.empty{color:var(--muted);font-size:.88rem;margin:0}
.ejemplo{background:var(--val-bg);color:var(--val);border-radius:10px;padding:8px 14px;font-size:.85rem;font-weight:600;margin:0}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .6s ease}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <p class="ejemplo" id="ejemplo" hidden>Datos de ejemplo: corre /po-team:tablero para llenarlo con tu tablero real.</p>
  <header class="top"><div><p class="eyb" id="eyb"></p><h1 id="titulo">Organización PO</h1></div><p class="date" id="fecha"></p></header>
  <section class="kpis" id="kpis" aria-label="Resumen"></section>
  <section class="sync" aria-live="polite">
    <div class="sync-h"><i class="dotlive" aria-hidden="true"></i><strong>Cambios en el tablero</strong><span id="sync-when"></span></div>
    <p class="sync-msg" id="sync-msg"></p>
    <ul class="chg" id="sync-chg" hidden></ul>
  </section>
  <section class="grid" id="sprints" aria-label="Sprints"></section>
  <div class="legend" id="legend"></div>
  <div class="two">
    <section class="sec"><h2>Fechas comprometidas</h2><ol class="hitos" id="hitos"></ol></section>
    <section class="sec"><h2>Pide atención</h2><div class="risk"><ul id="riesgos"></ul></div></section>
  </div>
</div>
<script id="datos" type="application/json">
{}
</script>
<script>
(() => {
  let D = {};
  try { D = JSON.parse(document.getElementById("datos").textContent || "{}"); } catch (e) { D = {}; }
  const $ = id => document.getElementById(id);
  const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
  const ETAPAS = (D.etapas && D.etapas.length ? D.etapas : [
    { clave: "desarrollo", nombre: "Desarrollo" }, { clave: "qa", nombre: "Validacion QA" }, { clave: "demo", nombre: "Pase a Demo" },
    { clave: "validacion", nombre: "Validacion Demo / Preprod" }, { clave: "vb", nombre: "VB cliente" }]);
  const IDX = Object.fromEntries(ETAPAS.map((e, i) => [e.clave, i]));
  const NOM = Object.fromEntries(ETAPAS.map(e => [e.clave, e.nombre]));
  const N = ETAPAS.length;
  // color del chip por etapa (y estados especiales)
  const COLOR = { desarrollo: "c-dev", qa: "c-ok", demo: "c-pase", validacion: "c-val", vb: "c-done" };
  const colorDe = t => t.observado ? "c-obs" : t.bloqueado ? "c-wait" : (COLOR[t.etapa] || "c-dev");
  const pts = t => Number(t.puntos) || 0;
  const iEt = t => (t.etapa in IDX ? IDX[t.etapa] : 0);
  const DIAS = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"];
  const dmy = s => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ""); return m ? `${m[3]}-${m[2]}` : (s || "?"); };
  const dia = s => { const d = new Date((s || "") + "T12:00:00"); return isNaN(d) ? "" : DIAS[d.getDay()]; };
  const hoy = (D.generado || new Date().toISOString()).slice(0, 10);
  const fmtHora = iso => { try { return new Intl.DateTimeFormat("es", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false }).format(new Date(iso)).replace(",", ""); } catch (e) { return iso || ""; } };
  const sprints = (D.sprints || []).filter(s => (s.tickets || []).length);
  const todos = sprints.flatMap(s => s.tickets);
  const cambiados = new Set((D.cambios || []).map(c => String(c.numero)));

  if (D.ejemplo) $("ejemplo").hidden = false;
  const titulo = D.titulo || "Organización PO";
  $("titulo").textContent = titulo; document.title = titulo;
  const projs = ((D.fuente && D.fuente.projects) || []).map(p => p.titulo).filter(Boolean).join(" · ");
  const rango = sprints.length ? (sprints.length > 1 ? `${sprints[0].nombre} – ${sprints[sprints.length - 1].nombre}` : sprints[0].nombre) : "";
  $("eyb").textContent = [D.equipo, projs, rango].filter(Boolean).join(" · ");
  $("fecha").textContent = `Actualizado ${dmy(hoy)}${D.generado ? " " + fmtHora(D.generado).split(" ")[1] : ""} · puntos estimados por el PO`;

  // avance ponderado: cada ticket vale (indice de su etapa + 1) / n etapas
  const pond = ts => { const tot = ts.reduce((a, t) => a + pts(t), 0); return tot ? Math.round(100 * ts.reduce((a, t) => a + pts(t) * (iEt(t) + 1) / N, 0) / tot) : 0; };
  const enVb = ts => ts.filter(t => t.etapa === "vb").reduce((a, t) => a + pts(t), 0);
  const total = todos.reduce((a, t) => a + pts(t), 0);

  // fechas comprometidas desde sprints[].fechas (+ hitos sueltos opcionales)
  const ETQ = { demo: "Pase a Demo", preprod: "Preprod", vb: "VB cliente" };
  const ETAPA_DE = { demo: "demo", preprod: "validacion", vb: "vb" };
  const hitos = [];
  for (const s of sprints) {
    for (const [k, v] of Object.entries(s.fechas || {})) {
      const lista = v && typeof v === "object" ? Object.entries(v).map(([cli, f]) => [`${ETQ[k] || k} ${cli}`, f]) : [[ETQ[k] || k, v]];
      for (const [txt, f] of lista) {
        if (!f) continue;
        const meta = IDX[ETAPA_DE[k]] ?? 0;
        const faltan = s.tickets.filter(t => iEt(t) < meta || t.observado);
        const tono = !faltan.length ? "c-done" : f < hoy ? "c-obs" : "c-val";
        hitos.push({ fecha: f, texto: txt, detalle: `${s.nombre}${!faltan.length ? " · hecho" : f < hoy ? ` · vencida, ${faltan.length} ticket${faltan.length > 1 ? "s" : ""} atrás` : ""}`, tono });
      }
    }
  }
  for (const h of (D.hitos || [])) hitos.push({ fecha: h.fecha || "", texto: h.texto, detalle: h.detalle || "", tono: { hecho: "c-done", riesgo: "c-obs", pendiente: "c-val" }[h.estado] || "c-val" });
  hitos.sort((a, b) => (a.fecha || "9999").localeCompare(b.fecha || "9999"));
  const prox = hitos.find(h => h.fecha >= hoy && h.tono !== "c-done");

  // KPIs
  const kpi = (b, sm, span, hl) => { const k = el("div", "kpi" + (hl ? " hl" : "")); const bb = el("b", null, b); if (sm) bb.append(el("small", null, sm)); k.append(bb, el("span", null, span)); return k; };
  $("kpis").append(
    kpi(pond(todos) + "%", null, "avance global ponderado"),
    kpi(String(enVb(todos)), ` / ${total}`, "puntos con VB cliente"),
    kpi(prox ? prox.texto : "Sin fechas pendientes", null, prox ? `Próximo hito: ${dmy(prox.fecha)} · ${prox.detalle}` : "Agrega las fechas en /po-team:sprint", true)
  );

  // cambios desde la revision anterior
  $("sync-when").innerHTML = "";
  if (D.generado) { $("sync-when").append("Revisado "); $("sync-when").append(el("b", null, fmtHora(D.generado))); }
  const cambios = D.cambios || [];
  const porNum = Object.fromEntries(todos.map(t => [String(t.numero), t]));
  if (cambios.length) {
    $("sync-msg").textContent = `${cambios.length} ${cambios.length === 1 ? "ticket cambió" : "tickets cambiaron"} de estado desde la revisión anterior:`;
    for (const c of cambios) {
      const li = el("li"), a = el("a", null, "#" + c.numero), t = porNum[String(c.numero)];
      a.href = (t && t.url) || "#"; a.target = "_blank"; a.rel = "noopener"; a.title = c.titulo || "";
      li.append(a, el("i", null, (c.de || "Nuevo en el tablero") + " →"), el("span", null, c.a || ""));
      $("sync-chg").append(li);
    }
    $("sync-chg").hidden = false;
  } else $("sync-msg").textContent = "Ningún ticket cambió de estado desde la revisión anterior.";

  // tarjetas de sprint
  const chip = t => {
    const a = el("a", "tk " + colorDe(t) + (cambiados.has(String(t.numero)) ? " nv" : ""));
    a.href = t.url || "#"; a.target = "_blank"; a.rel = "noopener";
    a.title = `${t.titulo || ""} · ${t.observado ? "Observado" : t.bloqueado ? "Bloqueado" : (NOM[t.etapa] || "Sin etapa")}${t.estado ? " · tablero: " + t.estado : ""}`;
    a.append(el("b", null, (t.observado ? "⚠ " : t.bloqueado ? "⛔ " : "") + "#" + t.numero), el("span", "pt", String(t.puntos ?? "?")));
    if (t.estado) a.append(el("span", "gh", t.estado));
    return a;
  };
  for (const s of sprints) {
    const ts = s.tickets, tp = ts.reduce((a, t) => a + pts(t), 0), vb = enVb(ts);
    const cur = Math.min(...ts.map(iEt)), todoVb = ts.every(t => t.etapa === "vb");
    const art = el("article", "spr");
    const hd = el("header"), dv = el("div");
    const m = /(\d+)\s*$/.exec(s.nombre || "");
    dv.append(el("p", "eyb", m ? (s.nombre.slice(0, m.index).trim() || "Sprint") : "Sprint"), el("h2", m ? null : "sm", m ? m[1] : s.nombre));
    const p = pond(ts), ring = el("div", "ring"); ring.style.setProperty("--p", p);
    const rs = el("span", null, String(p)); rs.append(el("small", null, "%")); ring.append(rs);
    hd.append(dv, ring); art.append(hd);
    const st = el("p", "stage"); st.append(el("span", "pill p" + Math.min(cur, 4), s.etapaTexto || (todoVb ? "VB cliente" : "En " + (NOM[ETAPAS[cur].clave] || "").toLowerCase())));
    art.append(st);
    if (s.objetivo) art.append(el("p", "sub", s.objetivo));
    if (s.nota) art.append(el("p", "nota", "Nota: " + s.nota));
    const ol = el("ol", "steps");
    ETAPAS.forEach((e, i) => { const li = el("li", todoVb || i < cur ? "on" : i === cur ? "now" : "off"); li.append(el("span", "dot"), el("span", "sl", e.nombre)); ol.append(li); });
    art.append(ol);
    const pp = el("div", "pts"), sp = el("span"); sp.append(el("b", null, String(vb)), ` / ${tp} pts con VB`);
    const obs = ts.filter(t => t.observado).length, blq = ts.filter(t => t.bloqueado).length;
    pp.append(sp, el("span", null, `${ts.length} tickets${obs ? ` · ${obs} obs.` : ""}${blq ? ` · ${blq} bloq.` : ""}`)); art.append(pp);
    const bar = el("div", "bar"), bi = el("i"); bi.style.width = (tp ? Math.round(100 * vb / tp) : 0) + "%"; bar.append(bi); art.append(bar);
    const tks = el("div", "tks"); ts.forEach(t => tks.append(chip(t))); art.append(tks);
    const f = s.fechas || {}, partes = [];
    if (f.demo) partes.push("Demo " + dmy(f.demo));
    if (f.preprod) partes.push(typeof f.preprod === "object" ? Object.entries(f.preprod).map(([c, d]) => `Preprod ${c} ${dmy(d)}`).join(" · ") : "Preprod " + dmy(f.preprod));
    if (f.vb) partes.push("VB " + dmy(f.vb));
    const ci = el("p", "cierre", "Cierre "); ci.append(el("b", null, partes.join(" · ") || (s.fin ? dmy(s.fin) : "sin fecha"))); art.append(ci);
    $("sprints").append(art);
  }
  if (!sprints.length) $("sprints").append(el("p", "empty", "No hay sprints con tickets todavía."));

  // leyenda
  $("legend").append(el("span", null, "Color de cada ticket:"));
  ETAPAS.forEach(e => $("legend").append(el("span", "tag " + (COLOR[e.clave] || "c-dev"), e.nombre)));
  $("legend").append(el("span", "tag c-obs", "⚠ Observado"), el("span", "tag c-wait", "⛔ Bloqueado"),
    el("span", null, "· el número pequeño son los puntos · el texto a la derecha es el estado en el tablero"));

  // fechas comprometidas
  for (const h of hitos) {
    const li = el("li", "h " + h.tono), d = el("span", "hd"), t = el("span", "ht");
    d.append(el("b", null, h.fecha ? dmy(h.fecha) : "?"), el("small", null, dia(h.fecha)));
    t.append(el("b", null, h.texto), el("small", null, h.detalle));
    li.append(d, t); $("hitos").append(li);
  }
  if (!hitos.length) $("hitos").append(el("li", "empty", "Sin fechas comprometidas. Defínelas con /po-team:sprint."));

  // lo que pide atencion: riesgos, decisiones pendientes, sin estimar / sin etapa
  const ul = $("riesgos");
  for (const r of (D.riesgos || [])) { const li = el("li"); li.append(el("span", "lv lv-" + (r.nivel || "medio"), r.nivel || "medio"), r.texto); ul.append(li); }
  for (const d of (D.decisiones || [])) { const li = el("li"); li.append(el("span", "lv lv-bajo", "decidir"), typeof d === "string" ? d : d.texto); ul.append(li); }
  const se = (D.sinEstimar || []).length, sn = (D.sinEtapa || []).length;
  if (se) ul.append(el("li", null, `${se} ticket${se > 1 ? "s" : ""} sin estimar: ${D.sinEstimar.map(t => "#" + t.numero).join(", ")}`));
  if (sn) ul.append(el("li", null, `${sn} ticket${sn > 1 ? "s" : ""} sin etapa del ciclo: ${D.sinEtapa.map(t => "#" + t.numero).join(", ")}`));
  if (!ul.children.length) ul.append(el("li", null, "Nada urgente."));
})();
</script>
</body>
</html>
